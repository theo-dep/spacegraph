name: CMake on multiple platforms

on:
  push:
    branches: [ "develop", "main" ]
  pull_request:
    branches: [ "develop", "main" ]

jobs:
  build:
    name: ${{ matrix.os }}-${{ matrix.compiler }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        compiler: [g++, clang++, cl]
        # Add more build types (Release, Debug, RelWithDebInfo, etc.) here
        include:
          - os: windows-latest
            compiler: cl
          - os: ubuntu-latest
            compiler: g++
          - os: ubuntu-latest
            compiler: clang++
          - os: macos-latest
            compiler: clang++
        exclude:
          - os: windows-latest
            compiler: g++
          - os: windows-latest
            compiler: clang++
          - os: ubuntu-latest
            compiler: cl
          - os: macos-latest
            compiler: g++
          - os: macos-latest
            compiler: cl

    steps:
    - uses: actions/checkout@v4

    - uses: lukka/get-cmake@latest

    - name: Setup anew (or from cache) vcpkg (and does not build any package)
      uses: lukka/run-vcpkg@v11
      with:
        vcpkgJsonGlob: 'vcpkg.json'

    - name: Install macOS build dependencies
      if: runner.os == 'macOS'
      run: |
        brew update
        brew install autoconf automake autoconf-archive libtool

    - name: Run CMake consuming CMakePreset.json and run vcpkg to build packages
      uses: lukka/run-cmake@v10
      with:
        configurePreset: vcpkg
        configurePresetAdditionalArgs: "['-DCMAKE_CXX_COMPILER=${{ matrix.compiler }}']"
        buildPreset: vcpkg
        testPreset: vcpkg
